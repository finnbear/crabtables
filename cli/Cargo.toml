[package]
name = "nfcrt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Claude Code", "Finn Bear"]
description = "Pure-Rust nftables command line tool, compatible with nft (built on crabtables)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/finnbear/crabtables"
readme = "README.md"
keywords = ["nftables", "nft", "netfilter", "firewall"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "nfcrt"
path = "src/main.rs"

[dependencies]
crabtables = { version = "0.1.0", path = "..", features = ["lang_json"] }

[dev-dependencies]
libc = "0.2"
